
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>القائد الخادم - QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f0e8;
      text-align: center;
      padding: 20px;
      color: #293b32;
    }
    .card {
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 3px 15px #0002;
    }
    h2 { color: #344f40; }
    #reader { width: 100%; margin: 20px auto; }
    #result {
      padding: 14px;
      background: #f0f4ef;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 9px;
      background: #344f40;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>القائد الخادم</h2>
    <p>نظام تسجيل الحضور والانصراف</p>
    <div id="reader"></div>
    <p id="result">اضغط Start لبدء مسح QR Code</p>
    <button onclick="startScanner()">بدء المسح</button>
  </div>

  <script>
    let scanner;

    function startScanner() {
      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          document.getElementById("result").textContent =
            "تم قراءة QR بنجاح: " + decodedText;
          scanner.stop();
        },
        () => {}
      ).catch(error => {
        document.getElementById("result").textContent =
          "تعذر تشغيل الكاميرا: " + error;
      });
    }
  </script>
</body>
</html>
